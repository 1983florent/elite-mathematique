# Déploiement Netlify : Veritex servi à la racine + fonctions de paiement.
# On publie le dossier `plagiat/` comme racine du site (l'application est donc
# à l'adresse « / », sans suffixe). Les fonctions restent dans netlify/functions.
[build]
  publish = "plagiat"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Le front appelle /api/... : on redirige vers les fonctions Netlify.
[[redirects]]
  from = "/api/creer-session"
  to = "/.netlify/functions/creer-session"
  status = 200

[[redirects]]
  from = "/api/recuperer-code"
  to = "/.netlify/functions/recuperer-code"
  status = 200

[[redirects]]
  from = "/api/verifier"
  to = "/.netlify/functions/verifier"
  status = 200
