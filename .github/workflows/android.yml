# Compile l'application Android (APK) à chaque mise à jour.
# L'APK est téléchargeable dans l'onglet « Actions » (rubrique Artifacts) ;
# sur la branche principale, il est aussi publié dans la release « Application Android ».
name: Application Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Tests et APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Banc de tests du logiciel
        run: node tests/run.js --seeds 40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../elite-mathematique.apk

      - name: Vérifier l'APK (signature et contenu)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs elite-mathematique.apk
          unzip -l elite-mathematique.apk > contenu.txt
          for f in assets/www/index.html assets/www/css/style.css assets/www/js/app.js assets/www/js/gen/tle.js assets/www/vendor/katex/katex.min.js; do
            grep -q " $f$" contenu.txt || { echo "Fichier absent de l'APK : $f"; exit 1; }
          done
          echo "Fichiers du logiciel dans l'APK : $(grep -c ' assets/www/' contenu.txt)"
          ls -la elite-mathematique.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elite-mathematique-apk
          path: elite-mathematique.apk
          if-no-files-found: error

      - name: Publier l'APK (branche principale)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android elite-mathematique.apk \
            --title "Application Android" \
            --notes "APK d'ELITE MATHÉMATIQUE, construit automatiquement à partir de la dernière version (commit ${GITHUB_SHA::7}). Fonctionne sans connexion. Android 5.0 ou plus." \
            --target "$GITHUB_SHA"
